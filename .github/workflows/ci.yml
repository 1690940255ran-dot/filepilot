name: CI

# 规格 T16：
#
# > Windows CI 执行类型检查、lint、契约检查、Rust 格式/Clippy、
# > 单元与**真实 NTFS 集成测试**、前端构建和桌面打包。
#
# 所以这个 workflow 里**没有 mock 替身**：Rust 侧的集成测试真的建文件、
# 真的开句柄、真的移文件。这也是它慢的原因，而那是值得的——
# 规格另一句话说得很清楚：「UI mock 通过不能替代真机文件执行验收」。
#
# ## 触发方式：为什么同时列了 `master` 和 `main`
#
# **2026-09-27 修正**：此前这里写「本仓库的默认分支就是 `main`」，那是错的。
# 仓库是用 API 以 `auto_init: false` 建的**空仓**，默认分支由**第一次推送**决定，
# 而第一次推的是 `master` —— 所以默认分支是 `master`。
#
# 后果是这条 workflow **一次都没触发过**：`push.branches` 不含 `master`，
# 而所有推送都发生在 `master` 上。这与 PR-005 记的「CI 的绿从未被观测过」
# 叠在一起，等于「没观测」+「根本不会跑」，比单纯没观测更糟。
#
# 现在两个都留着：`master` 是当前的默认分支，`main` 留作将来改名后的兜底。
# 功能分支通配保留 —— 这个项目要能在功能分支上先拿到一次真实 runner 结果。
#
# 教训：**触发器的分支名必须对着真实默认分支核对**，不能凭「初始提交在 main 上」
# 这种印象写。核对命令：
#   curl -s https://api.github.com/repos/<owner>/<repo> | grep default_branch

on:
  push:
    branches:
      - master
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 无用的增量编译数据在 CI 上是纯浪费：每次都是干净构建，
  # 而它会额外吃掉几 GB 磁盘。
  CARGO_INCREMENTAL: 0
  # runner 上 Python 的 stdout 默认是 cp1252，而本仓库的脚本会打印中文
  # （`print("[release] 路径重映射：")` 曾直接抛 UnicodeEncodeError 让打包 job 变红）。
  #
  # 真正的修法在脚本内部（各自 `sys.stdout.reconfigure(encoding="utf-8")`），
  # 这里只是**兜底**：万一将来又加了一个忘了设编码的脚本，也不至于再红一次。
  # 只靠环境变量是不够的 —— 本机当初就是靠在命令行前挂它绕过，
  # 结果换一个脚本又中一次（见 POST_RELEASE_TODO.md 的 CI-003）。
  PYTHONIOENCODING: utf-8

jobs:
  # 前端与契约检查跑在 Linux 上——它们与平台无关，而 Linux runner 更快更便宜。
  web:
    name: 前端 / 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 不写 version：让 action 自己读 package.json 的 `packageManager`
          # （pnpm@10.34.5）。写死 9 时 CI 用的是另一个大版本，
          # 而 lockfile 是 10 生成的——「本地过得去、CI 过不去」的经典开头。
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # `--frozen-lockfile`：规格要求「依赖安装使用 lockfile」。
      # 忘了带这个参数的话，CI 会**悄悄装成另一个版本**，而那是
      # 「本地明明过了」的经典成因。
      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `--reporter=verbose` 让每一条用例名都进日志。
      # 默认 reporter 只给汇总行，而汇总行**证明不了集合相等**
      # （PR-005：本地 687 条是不是 CI 跑的那 687 条，要看名字才能对账）。
      - name: 单元测试
        run: pnpm test --reporter=verbose

      - name: 前端构建
        run: pnpm build

      # 规格 T16「发布内容不包含真实路径样本、API Key」。
      # 在 runner 上二元二进制还不存在（脚本会 skip），但**源码/文档/脚本**
      # 里写死的本机路径当场就会被拦下——那是最常发生的一种。
      # 这个 job 跑在 ubuntu 上，解释器名是 python3（Windows 上才是 python）。
      #
      # 注意它的判定基准是**当前用户名**：在 runner 上用户名不是 `cj169`，
      # 所以它拦不住「为 cj169 写死的路径」——那条由本地跑这一脚拦住。
      # 两边都要跑，各自负责自己能看见的那一半。
      - name: 本机路径与密钥形状扫描
        run: python3 scripts/scan-release-content.py

  # Rust 侧必须在 Windows 上跑：这些测试用的是 NTFS 语义与 Win32 句柄。
  rust:
    name: Rust（Windows，真实文件操作）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 放在最前面：纯静态检查、几秒就出结果，能把「集成测试里进程内直调 WinRT」
      # 这类问题挡在 10 分钟的编译之前。
      #
      # 这条规矩本来就写在 `src-tauri/src/platform/ocr.rs` 的模块测试注释里，
      # 但 2026-09-27 修 CI-005 时还是被违反了 —— 于是做成机械检查，
      # 而不是继续指望注释（完整经过见 POST_RELEASE_TODO 的 CI-004）。
      - name: 集成测试隔离检查（禁止进程内直调 WinRT）
        run: python scripts/check-test-isolation.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        # `--locked`：Cargo.lock 与 Cargo.toml 不一致时直接失败，
        # 而不是悄悄解析出另一套依赖版本
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # `--features failpoints`：一部分集成测试只有在故障注入下才有意义
      # （崩溃点在恢复路径上）。不带这个 feature 跑，那些用例会被整段跳过，
      # 而 CI 依然显示全绿——那正是我们要避免的那种绿。
      #
      # `--test-threads=1`：**绕开一个已知的偶发失败，不是修复。**
      # `tests/analysis.rs` 的假 HTTP 服务在并行跑时会随机挂 1–4 条
      # （WinHTTP 12152 / 12030；同一命令连跑 7 次里挂 2 次，
      # `--test-threads=1` 稳定 29/29 通过）。
      # 判别实验与下一步见 `docs/TEST_MATRIX.md` 第 6.2 节。
      # 串行只是让 CI 的红绿有确定含义；那个根因仍然记在案上。
      #
      # 输出同时落盘，供下一步对账。
      #
      # **两个坑，都在本机实测过（2026-09-26），不是照抄的写法：**
      #
      # ① `$LASTEXITCODE` 必须手动传递。带管道时这条步骤的退出码取决于
      #    管道**最后一段**；`Tee-Object` 成功了，整步就绿——即使
      #    `cargo test` 挂了一片。这正是「沉默的红」，必须堵死。
      #
      # ② `Tee-Object -FilePath` 的父目录**必须已经存在**：目录不存在时
      #    它**静默不写**，只报一条 `Cannot find path` 的非终止错误，
      #    **退出码照样是命令自己的**。实测：`git rev-parse`（失败，128）
      #    + `Tee-Object -FilePath` 指向不存在的目录 → 退出码 128、文件没写。
      #    所以下面有「日志不存在就 exit 1」这条守卫——日志消失时
      #    CI 必须变红，而不是安静地"看起来都正常"。
      #
      # 关于 `Tee-Object` 能不能捕获到输出，实测结论（免得下次误判）：
      # 它写不写文件取决于管道里有没有对象流过。`cargo` 是**原生 exe**，
      # 输出走 success stream，`Tee-Object` 正常写文件（已用
      # `cargo --version 2>&1 | Tee-Object` 验证，日志 76 字节）。
      # 注意 `2>&1` 只合并 stderr，**不会**把 `Write-Host` 拉进管道。
      # CI-005：让「真实 OCR 识别」在 CI 上也能被验到。
      #
      # 此前这条覆盖是缺的：runner 没装中文 OCR 语言包，于是 `tests/extract.rs`
      # 里那两条用例只能走「如实报告缺失」的分支 ——
      # 而规格 T11 要求的「OCR 有文字时返回可搜索片段」在 CI 上**从未被验证过**。
      #
      # 光靠跳过还不够，更糟的是它会**静默**：语言包哪天没装上或没生效，
      # 用例照样绿，覆盖没了却没人知道。所以装完之后**立刻断言 OCR 真的可用**，
      # 并给测试步骤设 `FILEPILOT_REQUIRE_OCR=1` ——
      # 让「本该有 OCR 却报不可用」直接变成**失败**（见 tests/extract.rs 的 `ocr_required`）。
      #
      # 装的是系统能力（需要管理员，runner 是管理员）。实测本机装不了是因为
      # `Get-WindowsCapability -Online` 要求提升权限 —— 那是本机限制，不是 runner 的。
      - name: 安装中文 OCR 语言包
        shell: pwsh
        run: |
          $name = 'Language.OCR~~~zh-CN~0.0.1.0'
          Write-Host "安装 $name ..."
          $result = Add-WindowsCapability -Online -Name $name -ErrorAction Stop
          Write-Host ("RestartNeeded = " + $result.RestartNeeded)
          $result | Format-List | Out-String | Write-Host

      - name: 确认 OCR 真的可用（否则下面的用例会静默降级）
        shell: pwsh
        run: |
          [Windows.Media.Ocr.OcrEngine,Windows.Foundation,ContentType=WindowsRuntime] | Out-Null
          $langs = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages |
            ForEach-Object { $_.LanguageTag }
          Write-Host ("OCR 识别语言：" + ($langs -join '、'))
          $chinese = $langs | Where-Object { $_ -like 'zh*' }
          if (-not $chinese) {
            Write-Error ('装完语言包后仍没有中文 OCR —— 真实识别无法在 CI 上被验证。' +
              '不要放过这一条：它会让 CI-005 的覆盖缺口静默回来。')
            exit 1
          }
          Write-Host ("中文 OCR 就绪：" + ($chinese -join '、'))

      - name: 单元与集成测试
        shell: pwsh
        env:
          # 见 tests/extract.rs 的 `ocr_required()`：设了它，
          # 「本该有中文 OCR 却报 OCR_UNAVAILABLE」就是**失败**而不是静默跳过。
          FILEPILOT_REQUIRE_OCR: "1"
        run: |
          Set-Location -Path $env:GITHUB_WORKSPACE
          $log = Join-Path $env:GITHUB_WORKSPACE 'rust-test.log'
          cargo test --manifest-path src-tauri/Cargo.toml --features failpoints --locked -- --test-threads=1 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if (-not (Test-Path $log)) {
            Write-Error "测试日志没有写出来：$log（下游的 PR-005 对账会拿不到证据）"
            exit 1
          }
          Write-Host "测试日志已写出：$log（$((Get-Item $log).Length) 字节）"
          exit $code

      # 诊断 CI-004：崩溃点是「这条用例本身」还是「同进程内跑到这里时的累积状态」？
      #
      # 之所以要问这一句：崩的那条（`the_spaces_ocr_inserts_...`）与它上面
      # **已经通过**的 `a_chinese_image_...` 代码路径几乎相同 —— 都用同一张夹具、
      # 都会先问 `availability()`、在 OCR 不可用的机器上都该走「早退」分支。
      # 两条都不该崩，却只有后一条崩，那更像**累积状态**（COM 公寓 /
      # OCR 引擎对象生命周期之类），而不是某个输入本身有毒。
      #
      # 只在上一步失败时跑（平常零成本），且**不做断言**（continue-on-error）：
      # 它只负责产出证据，不负责判定。判据是：
      #   * 单独跑仍然崩 → 是「这个输入」触发的，可以按输入去复现
      #   * 单独跑通过   → 是累积状态，那就该考虑把 OCR 相关用例
      #                    隔离到独立测试进程（本项目对「一个崩溃带走邻居」
      #                    已有先例：`recovery_crash_child` 就是为此拆的 bin）
      - name: 诊断：单独跑可疑用例（仅在上一步失败时）
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location -Path $env:GITHUB_WORKSPACE
          Write-Host '=== A 单独跑崩溃的那一条 ==='
          cargo test --manifest-path src-tauri/Cargo.toml --features failpoints --locked --test extract the_spaces_ocr -- --test-threads=1 --nocapture
          Write-Host "A 退出码 = $LASTEXITCODE"
          Write-Host ''
          Write-Host '=== B 对照：单独跑它上面那条（已知能过）==='
          cargo test --manifest-path src-tauri/Cargo.toml --features failpoints --locked --test extract a_chinese_image -- --test-threads=1 --nocapture
          Write-Host "B 退出码 = $LASTEXITCODE"
          Write-Host ''
          Write-Host '=== C 只跑整个 extract 二进制里的 image 相关用例 ==='
          cargo test --manifest-path src-tauri/Cargo.toml --features failpoints --locked --test extract image -- --test-threads=1
          Write-Host "C 退出码 = $LASTEXITCODE"

      # PR-005 的那一脚：把每个目标的 `test result:` 汇总行摊平到日志里。
      #
      # 为什么要单独一步：`cargo test` 的完整输出有几千行，而 runner 日志
      # 默认折叠。摊平之后，PR-005 的对账只需要读这几行——
      # **本地 687 与 CI 的每一个目标逐行比对**，而不是拿一个总数猜。
      #
      # 这一步**不做断言**（CI 上的数字尚未首次观测，写死期望值等于
      # 自证一个还没验证过的前提）；它只负责让证据可见。
      #
      # 另外，它**必须能找到日志**：上一步加了「日志不存在就 exit 1」，
      # 所以走到这里日志一定在；万一不在（比如上一步被跳过），
      # 下面会给出显式的红，而不是安静地"看起来都正常"。
      - name: 摊平各测试目标的结果行（供与本地对账）
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'rust-test.log'
          if (-not (Test-Path $log)) {
            Write-Error "找不到 $log —— 上一轮测试可能根本没跑起来，没有可对账的证据"
            exit 1
          }

          $lines = Select-String -Path $log -Pattern '^test result:'
          Write-Host "各目标结果行共 $($lines.Count) 条："
          $lines | ForEach-Object { Write-Host $_.Line }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`n### Rust 各测试目标结果（PR-005 对账用）`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          $lines | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_.Line }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`n与本机逐目标比对，见 docs/TEST_MATRIX.md §4.1.1。"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-log
          path: rust-test.log
          retention-days: 14
          if-no-files-found: warn

  # 契约检查需要 Rust 侧生成产物，所以它单独一个 job：
  # 放在 `web` 里会让那个 job 也要装 Rust 工具链。
  contracts:
    name: 契约一致性
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: 重新生成契约并比对
        # `contracts:check` 会重新生成一遍再与仓库里的比对。
        # 改了 Rust 侧的序列化类型却忘了重新生成时，这一步会红——
        # 而那是唯一会红的地方：前端拿到的是一份过时的类型定义，
        # 类型检查照样通过。
        run: pnpm contracts:check

  # 端到端：跑在 Playwright 的浏览器模式，IPC 全部由契约 mock 提供。
  #
  # **它不验证真实文件操作。** 规格明确要求报告里标明这一点。
  e2e:
    name: 端到端（浏览器模式，mock IPC）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 端到端测试
        run: pnpm test:e2e

      # 生产 CSP + 生产构建产物下的启动回归。
      #
      # 为什么单独一条：`pnpm dev` / `pnpm test:e2e` 用的是 `devCsp`，
      # 而**发出去的那条 CSP 是 `csp`**。两者的差异曾经导致安装版整页白屏
      # （前端用 Ajv 运行时编译 schema，需要 `'unsafe-eval'`），
      # 而当时所有测试都是绿的。这条用例把那个差异锁住了。
      - name: 构建前端产物
        run: pnpm build

      - name: 生产 CSP 启动回归
        run: pnpm test:prod-csp

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 桌面打包单独一个 job：它是最慢的一步，而失败原因通常与前面几步不同
  # （图标缺失、bundle 配置写错、NSIS 下载失败），分开跑更容易定位。
  #
  # 它在 PR 上默认**不跑**：打包要几分钟，而它验的是 bundle 配置，
  # 与一次源码改动的关系很弱。手动 `workflow_dispatch` 或推 main 时照跑。
  bundle:
    name: 桌面打包（NSIS，用户级）
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: 打包
        # `tauri.conf.json` 里的 `bundle.windows.nsis.installMode` 是
        # `currentUser`——规格要求「用户级安装包，**无需管理员权限**」。
        #
        # `beforeBuildCommand` 里带了 `pnpm bundle:workers`：
        # 它先把解析工作进程编译出来放进 `src-tauri/binaries/`，
        # Tauri 才会把它收进安装目录（`bundle.externalBin`）。
        run: pnpm desktop:build

      - name: 确认安装包与解析工作进程都存在
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Error "没有生成 NSIS 安装包"
            exit 1
          }
          foreach ($item in $installers) {
            Write-Host ("安装包: " + $item.Name + " (" + [math]::Round($item.Length / 1MB, 1) + " MB)")
          }

          # 规格 T16：「打包 OCR/解析 worker 所需资源**并验证可找到**」。
          #
          # 这一项必须由 CI 断言，因为漏掉它时**编译与打包都会成功**：
          # 安装包照常产出，只有用户第一次用 AI 模式才会发现解析不了。
          # 名字写错（target triple 拼错）时的表现也是这样。
          $worker = Get-ChildItem -Path src-tauri/binaries -Filter "extract_worker-*.exe" -ErrorAction SilentlyContinue
          if (-not $worker) {
            Write-Error "解析工作进程没有被 staging 到 src-tauri/binaries/，安装包里不会有它"
            exit 1
          }
          foreach ($item in $worker) {
            Write-Host ("worker: " + $item.Name + " (" + [math]::Round($item.Length / 1MB, 1) + " MB)")
          }

          # 规格 T17：「生成安装包 SHA-256 和发布说明」。
          # 未签名安装包唯一的来源验证手段就是这个值，所以在 CI 上就打印出来。
          #
          # **它不会等于本机那一个**：构建可重现不在规格里，CI 与本地
          # 各有各的路径前缀与时间戳。这里的值证明的是「这一次 CI 构建
          # 产出了什么」，发布页上的哈希必须以**本地那次**为准。
          $hash = (Get-FileHash -Path $installers[0].FullName -Algorithm SHA256).Hash
          Write-Host ("SHA256（本次 CI 构建）: " + $hash)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("安装包 " + $installers[0].Name + "`nSHA256（CI 构建，非发布页用值） ``" + $hash + "``")

      # 刚构建完的**可执行文件**在这里被扫一次：`scripts/build-desktop.py`
      # 用 --remap-path-prefix 去掉了编译机路径，这条就是那个保护的回归测试。
      # 没有它时，重映射哪天被改坏了（或有人改回 `tauri build`），
      # 产物里会重新带上 runner 的用户名，而**没有任何东西会红**。
      #
      # 这一条在 runner 上比在本地更有意义：它检查的是「CI 这台编译机」
      # 的用户名有没有漏进产物——那正是发布物会带走的东西。
      #
      # **必须带 `--verbose`**：2026-09-27 这条在 CI 上真的红了，报告是
      #   [HIT] extract_worker.exe -> 编译机用户路径（1 个用户：runneradmin）
      #   [HIT] filepilot.exe     -> 编译机用户路径（1 个用户：runneradmin）
      # 但**没说是哪个前缀漏的** —— `--remap-path-prefix` 一共映射了三条
      # （项目目录 / .cargo/registry / .rustup/toolchains），只报「有个用户名」
      # 无法判断是哪一条没盖住。带 `--verbose` 才会逐条打出命中的原文，
      # 否则每次都得靠猜。0 命中时它不额外输出，所以常开无副作用。
      - name: 扫描产物内容（真实路径 / 密钥形状）
        run: python scripts/scan-release-content.py --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: filepilot-nsis-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
